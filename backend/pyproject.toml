[project]
name = "model-workbench-backend"
version = "0.1.0"
description = "Backend for model-workbench: discover, run, and evaluate Hugging Face models."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psutil>=6.1",
    "huggingface_hub>=0.26",
    "llama-cpp-python>=0.3.8",
    "torch>=2.4",
    "transformers>=4.44",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits the real Hugging Face Hub API (excluded by default)",
    "ml: local-inference backend tests, run locally via `make test-ml` (excluded from CI)",
]
addopts = "-m 'not network'"

[tool.coverage.run]
source = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
